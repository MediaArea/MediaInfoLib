name: FileName Checks

on: [push, pull_request]

env:
  BRANCH_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:

  Unix:
    strategy:
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: macOS (arm64)
            os: macos-26
          - name: macOS (x64)
            os: macos-15-intel
          - name: Linux without Unicode
            os: ubuntu-26.04
            configure: --disable-unicode
          - name: macOS without Unicode
            os: macos-15-intel
            configure: --disable-unicode
      fail-fast: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CXXFLAGS: -O0 -Werror
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: OS packets
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1 # Prevent Homebrew third-party trust warnings due to GitHub's pre-installed taps
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update -y
            sudo apt-get install -y zlib1g-dev
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install automake libtool
          fi
      - name: pymediainfo
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install pymediainfo
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      - name: ZenLib
        run: |
          sh .github/clone_branch.sh ZenLib ../ZenLib
          cd ../ZenLib/Project/GNU/Library
          autoreconf -if
          ./configure --enable-silent-rules --enable-static ${{ matrix.configure }}
          make -j4
          sudo make install # libmediainfo needs the installed library when pymediainfo loads it on macOS
      - name: Configure
        run: |
          cd Project/GNU/Library
          autoreconf -if
          ./configure --enable-silent-rules
      - name: Compile
        run: |
          cd Project/GNU/Library
          make -j4
      - name: Check
        run: |
          cd Project/GNU/Library
          make check TESTS=filename.sh

  Alpine:
    runs-on: ubuntu-latest
    container: alpine:latest
    env:
      CXXFLAGS: -O0
    steps:
      - name: OS packets
        run: apk add --no-cache autoconf automake bash build-base git libtool pkgconf zlib-dev
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: ZenLib
        run: |
          sh .github/clone_branch.sh ZenLib ../ZenLib
          cd ../ZenLib/Project/GNU/Library
          autoreconf -if
          ./configure --enable-silent-rules --enable-static
          make -j4
      - name: Configure
        run: |
          cd Project/GNU/Library
          autoreconf -if
          ./configure --enable-silent-rules
      - name: Compile
        run: |
          cd Project/GNU/Library
          make -j4
      - name: Check
        run: |
          cd Project/GNU/Library
          make check TESTS=filename.sh

  FreeBSD:
    strategy:
      matrix:
        include:
          - name: FreeBSD
          - name: FreeBSD without Unicode
            configure: --disable-unicode
      fail-fast: false
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check
        uses: vmactions/freebsd-vm@v1
        with:
          envs: BRANCH_OWNER BRANCH_NAME
          usesh: true
          prepare: pkg install -y autoconf automake bash git gmake libtool pkgconf
          run: |
            set -e
            sh .github/clone_branch.sh ZenLib ../ZenLib
            cd ../ZenLib/Project/GNU/Library
            autoreconf -if
            ./configure --enable-silent-rules --enable-static ${{ matrix.configure }} CXXFLAGS=-O0
            gmake -j4
            cd -
            cd Project/GNU/Library
            autoreconf -if
            ./configure --enable-silent-rules CXXFLAGS=-O0
            gmake -j4
            gmake check TESTS=filename.sh

  Windows:
    strategy:
      matrix:
        include:
          - architecture: x64
            vcvarsall: x64
          - architecture: Win32
            vcvarsall: x86
      fail-fast: false
    name: Windows (${{ matrix.architecture }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings
        run: git config --global core.autocrlf false # Test scripts with LF line endings
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: zlib and ZenLib
        run: |
          git -C .. clone --depth=1 https://github.com/MediaArea/zlib.git
          sh .github/clone_branch.sh ZenLib ../ZenLib
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Compile
        run: MSBuild.exe Project/MSVC2026/MediaInfoLib.slnx -t:MediaInfoDll -p:Configuration=Release -p:Platform=${{ matrix.architecture }} -m -verbosity:quiet
      - name: Compile test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvarsall }}
          set Output=Project\MSVC2026\${{ matrix.architecture }}\Release
          cl /nologo /EHsc /O1 /DUNICODE /D_UNICODE /FoProject\GNU\Library\test\mil_filename.obj /FeProject\GNU\Library\test\mil_filename.exe Project\GNU\Library\test\Source\filename.cpp %Output%\MediaInfo.lib || exit /b 1
          copy %Output%\MediaInfo.dll Project\GNU\Library\test\
      - name: Check
        run: |
          cd Project/GNU/Library/test
          bash filename.sh 9>&1 # Test of make check (no make in Git Bash)
